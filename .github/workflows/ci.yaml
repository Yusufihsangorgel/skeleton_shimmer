name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags demo

      # The two figures in the README come out of these tests, and each run
      # asserts what its figure is evidence for before it writes anything: the
      # default column has to change between frames and the disableAnimations
      # column has to stay put; a Shimmer per card has to light every card at
      # once and one ShimmerScope has to leave the outer tiles off the band.
      # The behaviour itself is already covered by the suite above. What these
      # lines add is that a published figure cannot drift away from what it
      # depicts. Writing to a temp path here, since CI has nothing to commit.
      - run: flutter test --tags demo test/reduced_motion_capture_test.dart
      - run: flutter test --tags demo test/sync_capture_test.dart

      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
